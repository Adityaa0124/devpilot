services:
  - type: web
    name: devpilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./devpilot.db
      - key: ALLOW_SHELL_EXECUTION
        value: "true"
      - key: EXECUTION_TIMEOUT_SECONDS
        value: "10"

