version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: devpilot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devpilot
    ports:
      - "5432:5432"
    volumes:
      - devpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: devpilot-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/devpilot
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devpilot_pgdata:
